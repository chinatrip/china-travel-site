name: Sync audited wiki content

# Triggered by the wiki repo (repository_dispatch: wiki-updated) when audited
# content changes, or manually. Clones the wiki, copies `review.status: audited`
# pages into src/content/, and opens/updates a CONTENT PR — it does NOT deploy.
# The content PR then goes through ci.yml (gate + preview) like any other PR;
# merging it triggers deploy.yml (production). Single mental model: everything
# ships via a PR to main.
#
# The PR is authored by a GitHub App (not a human, not the default GITHUB_TOKEN),
# so (a) the `reviewers:` request works and notifies, and (b) the PR triggers ci.yml.

on:
  repository_dispatch:
    types: [wiki-updated]
  workflow_dispatch: {}

concurrency:
  group: sync-content
  cancel-in-progress: false # content is a write op — queue, don't cancel mid-run

permissions:
  contents: read

jobs:
  sync-content:
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App token (authors the content PR)
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            china-travel-site
            foreigner-visiting-china-wiki

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      # Aborts non-zero (no PR) if 0 audited pages or wiki unreachable — see
      # scripts/sync-content.mjs (#4 guard).
      - name: Sync audited content from wiki
        run: npm run sync-content
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Open / update content PR
        uses: peter-evans/create-pull-request@v7
        with:
          # App token → PR author is the App (not a human), so the review request
          # below notifies the reviewer AND the PR triggers ci.yml (gate + preview).
          token: ${{ steps.app-token.outputs.token }}
          branch: auto/content-sync
          base: main
          add-paths: src/content
          commit-message: "chore: sync audited wiki content"
          title: "🤖 Content sync from wiki (audited)"
          body: |
            Automated sync of `review.status: audited` wiki content into `src/content/`.

            Triggered by a `wiki-updated` dispatch. **Review the diff + the preview link
            (posted by CI), then merge to publish to production.**

            ⚠️ Sanity-check the diff for unexpected deletions or stripped front matter
            (e.g. lost `description`/`faqs`) — those indicate wiki content drift.
          reviewers: 1Feng
