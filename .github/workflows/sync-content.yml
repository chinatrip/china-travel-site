name: Sync audited wiki content

# Triggered by the wiki repo (repository_dispatch: wiki-updated) when audited
# content changes, or manually. Clones the wiki and runs the NON-DESTRUCTIVE
# sync (scripts/sync-content.mjs): site-owned frontmatter (description/faqs/
# category) and site-native pages are preserved; bodies are 3-way merged against
# the base recorded in src/content/wiki-sync-state.json. Overlapping edits leave
# conflict markers in the PR — check-conflict-markers.mjs (in `npm test`) keeps
# CI red until a human resolves them. The PR body is the generated sync report.
# The content PR then goes through ci.yml (gate + preview) like any other PR;
# merging it triggers deploy.yml (production). Single mental model: everything
# ships via a PR to main.
#
# The PR is authored by a GitHub App (not a human, not the default GITHUB_TOKEN),
# so (a) the `reviewers:` request works and notifies, and (b) the PR triggers ci.yml.

on:
  repository_dispatch:
    types: [wiki-updated]
  workflow_dispatch: {}

concurrency:
  group: sync-content
  cancel-in-progress: false # content is a write op — queue, don't cancel mid-run

permissions:
  contents: read

jobs:
  sync-content:
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App token (authors the content PR)
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            china-travel-site
            foreigner-visiting-china-wiki

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      # Aborts non-zero (no PR) if 0 audited pages or wiki unreachable — see
      # scripts/sync-content.mjs (#4 guard).
      - name: Sync audited content from wiki
        run: npm run sync-content
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Open / update content PR
        uses: peter-evans/create-pull-request@v7
        with:
          # App token → PR author is the App (not a human), so the review request
          # below notifies the reviewer AND the PR triggers ci.yml (gate + preview).
          token: ${{ steps.app-token.outputs.token }}
          branch: auto/content-sync
          base: main
          # src/content includes wiki-sync-state.json, where the sync script durably
          # records removed/no-base warnings — so even a warnings-only run (no content
          # file changed) produces a diff and this PR materializes instead of the
          # warnings silently vanishing. The report also lands on the run's summary page.
          add-paths: src/content
          commit-message: "chore: sync audited wiki content (non-destructive merge)"
          title: "🤖 Content sync from wiki (audited)"
          # The sync script writes the per-page merge report (clean/conflict/no-base/
          # removed) to sync-report.md — it becomes the PR description.
          body-path: sync-report.md
          reviewers: 1Feng
