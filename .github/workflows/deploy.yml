name: Deploy (production)

# Runs on every push to main (i.e. when any PR is merged).
# Re-runs the full gate, then deploys to the production Cloudflare Worker
# (serves chinaguide.ai). `wrangler deploy` reads wrangler.json (assets: ./dist).
#
# The deploy step is guarded by `env.CF_TOKEN != ''`. Until the CLOUDFLARE_API_TOKEN
# secret is set (and the Cloudflare native Git integration is disconnected), this
# step skips and Cloudflare's native integration still deploys. After that, this
# workflow is the single source of production deploys. Manual re-run / rollback via
# the "Run workflow" button (workflow_dispatch).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Test (node:test + build + internal-link guard)
        run: npm test

      - name: Deploy to production (Cloudflare Workers)
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
