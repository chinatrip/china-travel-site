name: CI & Preview

# Runs on every PR to main (code PRs AND the auto content-sync PR).
# 1. npm test = node:test + astro build + internal-link trailing-slash guard
# 2. Deploy a Cloudflare Workers PREVIEW version (does not touch production)
# 3. Surface the preview URL in BOTH the run Summary page and a PR comment
#
# The Cloudflare steps are guarded by `env.CF_TOKEN != ''`, so before the
# CLOUDFLARE_API_TOKEN secret is configured the workflow still passes (test only).
#
# A separate `seo-review` job runs in PARALLEL and reviews the SEO/GEO quality of
# changed content with an LLM (DeepSeek `deepseek-chat`). It is independent of `test`, so
# it NEVER affects preview generation. On ordinary content PRs it BLOCKS on one
# criterion, `faq_grounding` — everything else, plus the wiki sync branch and the manual
# full-site scan, stays advisory (reported, flagged "would block", exits 0). It is NOT a
# required check, so a red run is a signal to the reviewer rather than a hard merge stop;
# guarded by `env.DEEPSEEK_API_KEY != ''` so it soft-passes until the secret is set.

on:
  pull_request:
    branches: [main]
  # Manual full-site SEO/GEO scan: runs `seo-review` over EVERY content page on demand
  # (pull_request still only reviews the diff). Trigger via `gh workflow run ci.yml`
  # or the Actions UI; the report lands in the run's Summary page (no PR to comment on).
  # The `test` job is gated to pull_request only — dispatch runs the seo-review job alone.
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    # PR-only: preview deploy + PR comment make no sense on manual workflow_dispatch
    # (no PR context). Dispatch runs the `seo-review` job (full-site scan) by itself.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # See deploy.yml — the sitemap build reads git history for <lastmod>.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Test (node:test + build + internal-link guard)
        id: tests
        run: npm test

      - name: Deploy preview (Cloudflare Workers version)
        id: preview
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Stable per-PR preview URL: pr-<number>-china-travel-site.<subdomain>.workers.dev
          command: versions upload --preview-alias pr-${{ github.event.number }}

      # Render the CI result + preview links on the run's Summary page.
      # Runs on `always()` so the failure paths below are reachable (with
      # `success()` the whole step is skipped on failure → dead code). We must
      # therefore report the REAL test/preview outcomes, not a hardcoded "passed".
      # `versions upload` does NOT populate wrangler-action's `deployment-url`,
      # so the preview line keys off the step OUTCOME + the deterministic alias.
      - name: CI report (run summary)
        if: always()
        env:
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          PREVIEW_OUTCOME: ${{ steps.preview.outcome }}
          PREVIEW_URL: ${{ steps.preview.outputs.deployment-url }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          {
            if [ "$TESTS_OUTCOME" = "success" ]; then
              echo "## ✅ CI Report"
              echo ""
              echo "**Tests + build + internal-link guard:** passed"
            else
              echo "## ❌ CI Report"
              echo ""
              echo "**Tests + build + internal-link guard:** ${TESTS_OUTCOME:-failed} — see logs"
            fi
            echo ""
            # Preview ("Deploy preview" implicitly ANDs success(), so it is
            # skipped when tests fail even though CF_TOKEN is set).
            if [ "$PREVIEW_OUTCOME" = "success" ]; then
              echo "### 🔍 Preview deployment"
              echo ""
              echo "| | |"
              echo "|---|---|"
              echo "| Stable alias | <https://pr-${PR_NUMBER}-china-travel-site.yiyang-pku.workers.dev> |"
              if [ -n "$PREVIEW_URL" ]; then
                echo "| Version URL | <$PREVIEW_URL> |"
              fi
            elif [ "$PREVIEW_OUTCOME" = "failure" ]; then
              echo "> ⚠️ Preview deploy failed — see logs."
            elif [ -z "$CF_TOKEN" ]; then
              echo "> 🔍 Preview skipped — \`CLOUDFLARE_API_TOKEN\` not configured."
            else
              echo "> 🔍 Preview skipped — tests failed (preview only runs on green tests)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Runs on `always()` so the single marker comment ALWAYS reflects the
      # CURRENT commit. With `if: outcome == success` a later failing push would
      # leave a stale "✅ ready" comment (same marker) pointing at an old version.
      - name: Comment preview URL on PR
        if: always()
        uses: actions/github-script@v7
        env:
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          PREVIEW_OUTCOME: ${{ steps.preview.outcome }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # `versions upload` doesn't fill deployment-url; use the deterministic stable alias.
          STABLE_URL: https://pr-${{ github.event.number }}-china-travel-site.yiyang-pku.workers.dev
        with:
          script: |
            const marker = '<!-- ci-preview-bot -->';
            const url = process.env.STABLE_URL;
            const tests = process.env.TESTS_OUTCOME;
            const preview = process.env.PREVIEW_OUTCOME;
            const hasToken = (process.env.CF_TOKEN || '') !== '';
            const stamp = `_(更新于 ${new Date().toISOString()})_`;
            // Build the body from the CURRENT commit's status (single source of truth).
            let body;
            if (tests !== 'success') {
              body = `${marker}\n❌ **CI 失败** — 本次提交测试/构建未通过,预览不可用。见 Actions logs。\n\n${stamp}`;
            } else if (preview === 'success') {
              // @1Feng — see note: if the PR author IS this user, the mention won't notify.
              body = `${marker}\n✅ **CI 通过,预览就绪**:${url}\n\n@1Feng 可审阅合并。${stamp}`;
            } else if (preview === 'failure') {
              body = `${marker}\n⚠️ **CI 通过,但预览部署失败** — 见 Actions logs。\n\n${stamp}`;
            } else if (!hasToken) {
              body = `${marker}\n✅ **CI 通过**;预览 URL 未配置(\`CLOUDFLARE_API_TOKEN\` 未设)。\n\n${stamp}`;
            } else {
              // tests green + token set but preview neither success/failure (unexpected).
              body = `${marker}\n✅ **CI 通过**;预览状态未知(${preview || 'n/a'})— 见 Actions logs。\n\n${stamp}`;
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body,
              });
            }

  # Independent advisory check (parallel to `test`): AI review of SEO/GEO quality of
  # changed content. Preview lives in `test` and is NEVER affected by this job.
  # BLOCKING for content PRs, on `faq_grounding` only (SEO_REVIEW_ENFORCED_IDS).
  # Every other blocking-class criterion, and every run on the sync branch or the
  # manual scan, stays advisory — reported and flagged "would block", never
  # hard-failing. NOT a required check (see .github/BRANCH_PROTECTION.md), so a
  # red run is a signal to the human reviewer rather than a hard merge stop.
  # Still guarded by `env.DEEPSEEK_API_KEY != ''` → soft-passes until the secret is set.
  seo-review:
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      # Blocking for ordinary content PRs; advisory everywhere else.
      #
      # Exempt: the wiki sync PR (auto/content-sync) and the manual full-site
      # scan. The sync PR bundles every pending page and the gate re-reviews
      # each in full, so a latent issue on a page the sync never touched would
      # hard-block an unrelated deploy — that is exactly why an earlier blocking
      # rollout was reverted. The dispatch scan is an audit, not a gate.
      SEO_REVIEW_MODE: >-
        ${{ (github.event_name == 'pull_request' && github.head_ref != 'auto/content-sync')
            && 'blocking' || 'advisory' }}
      # Enforce one criterion at a time. faq_grounding is the one we have swept
      # for and seen catch a real live defect; the other four still report as
      # "would block" without failing the run. "Swept", not "clean": the judge
      # is non-deterministic, so a page that read clean one run can surface a
      # finding the next — the 2026-08-19 full scan turned up three that the
      # pre-rollout sweep had not reported.
      SEO_REVIEW_ENFORCED_IDS: faq_grounding
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git diff base...HEAD needs full history

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      # pull_request → review only the diff (default cap 25, plenty for a PR).
      # workflow_dispatch → `--all` reviews EVERY content page, so the cap must
      # stay comfortably above the content-file count or the "full-site" scan
      # silently isn't. It has already been wrong once: the cap was 40 while the
      # corpus had grown to 41, so the 2026-08-19 scan skipped apps/wechat.md and
      # still reported as a full scan. 200 buys years of headroom, and
      # test/seo-review.test.mjs now fails if the corpus ever catches up.
      # Both write the report to seo-review-report.md AND $GITHUB_STEP_SUMMARY.
      - name: SEO/GEO review of changed content
        id: seo
        if: env.DEEPSEEK_API_KEY != ''
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/seo-review.mjs --all
          else
            node scripts/seo-review.mjs
          fi
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SEO_REVIEW_MAX_FILES: ${{ github.event_name == 'workflow_dispatch' && '200' || '25' }}

      # PR-only: on workflow_dispatch there is no PR to comment on (the report lives
      # in the run Summary, written by the script via $GITHUB_STEP_SUMMARY).
      - name: Comment SEO/GEO report on PR
        if: always() && github.event_name == 'pull_request' && env.DEEPSEEK_API_KEY != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- seo-review-bot -->';
            let report = '';
            try { report = fs.readFileSync('seo-review-report.md', 'utf8'); } catch {}
            const body = report || `${marker}\n⚠️ SEO/GEO review did not produce a report.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body,
              });
            }
