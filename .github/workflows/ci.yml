name: CI & Preview

# Runs on every PR to main (code PRs AND the auto content-sync PR).
# 1. npm test = node:test + astro build + internal-link trailing-slash guard
# 2. Deploy a Cloudflare Workers PREVIEW version (does not touch production)
# 3. Surface the preview URL in BOTH the run Summary page and a PR comment
#
# The Cloudflare steps are guarded by `env.CF_TOKEN != ''`, so before the
# CLOUDFLARE_API_TOKEN secret is configured the workflow still passes (test only).

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Test (node:test + build + internal-link guard)
        run: npm test

      - name: Deploy preview (Cloudflare Workers version)
        id: preview
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Stable per-PR preview URL: pr-<number>-china-travel-site.<subdomain>.workers.dev
          command: versions upload --preview-alias pr-${{ github.event.number }}

      # Render the CI result + preview links on the run's Summary page.
      - name: CI report (run summary)
        if: success()
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.deployment-url }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          {
            echo "## ✅ CI Report"
            echo ""
            echo "**Tests + build + internal-link guard:** passed"
            echo ""
            if [ -n "$PREVIEW_URL" ]; then
              echo "### 🔍 Preview deployment"
              echo ""
              echo "| | |"
              echo "|---|---|"
              echo "| Preview URL | <$PREVIEW_URL> |"
              echo "| Stable alias | <https://pr-${PR_NUMBER}-china-travel-site.yiyang-pku.workers.dev> |"
            else
              echo "> 🔍 Preview skipped — \`CLOUDFLARE_API_TOKEN\` not configured."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on PR
        if: steps.preview.outcome == 'success' && steps.preview.outputs.deployment-url != ''
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.deployment-url }}
        with:
          script: |
            const marker = '<!-- ci-preview-bot -->';
            const url = process.env.PREVIEW_URL;
            // @1Feng — see note: if the PR author IS this user, the mention won't notify.
            const body = `${marker}\n✅ **CI 通过,预览就绪**:${url}\n\n@1Feng 可审阅合并。_(更新于 ${new Date().toISOString()})_`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body,
              });
            }
