name: diag-openrouter
on: pull_request
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Key presence
        run: |
          echo "secret length: ${#OPENROUTER_API_KEY}"
          echo "starts with sk-or-v1: $( [ "${OPENROUTER_API_KEY#sk-or-v1-}" != "$OPENROUTER_API_KEY" ] && echo yes || echo no )"
      - name: Auth key endpoint
        run: |
          echo "--- GET /api/v1/auth/key ---"
          curl -s -w "\nHTTP %{http_code}\n" https://openrouter.ai/api/v1/auth/key -H "Authorization: Bearer $OPENROUTER_API_KEY"
      - name: Minimal chat call
        run: |
          echo "--- POST /api/v1/chat/completions (openai/gpt-5.5) ---"
          curl -s -w "\nHTTP %{http_code}\n" https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"model":"openai/gpt-5.5","messages":[{"role":"user","content":"ping"}],"max_tokens":1}'
